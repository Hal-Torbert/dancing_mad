<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P4 デバフカンペ・マジックアウト計算</title>
  <link rel="stylesheet" href="debuff-cheatsheet.css">
</head>
<body>
  <header>
    <div><span>P4 TANK TOOL</span><h1>デバフカンペ</h1></div>
    <a href="index.html">← メインへ</a>
  </header>
  <main>
    <section class="cheatsheet">
      <div class="section-head"><span>DEBUFF CHECK</span><h2>デバフ判定</h2></div>
      <div class="gc-select" data-gc="GC1">
        <h3>GC1</h3>
        <div class="choice-row" data-key="gc1-element"><b>属性</b><button data-value="雷外"><i class="tile-icon sprite lightning"></i><span>雷外</span></button><button data-value="水外"><i class="tile-icon sprite water"></i><span>水外</span></button></div>
        <div class="choice-row" data-key="gc1-gaze"><b>視線</b><button data-value="見る"><i class="tile-icon sprite gaze"></i><span>見る</span></button><button data-value="見ない"><i class="tile-icon sprite gaze"></i><span>見ない</span></button></div>
        <div class="choice-row" data-key="gc1-fire"><b>炎</b><button data-value="外"><i class="tile-icon sprite fire"></i><span>外</span></button><button data-value="中"><i class="tile-icon sprite fire"></i><span>中</span></button></div>
      </div>
      <div class="gc-select" data-gc="GC2">
        <h3>GC2</h3>
        <div class="choice-row" data-key="gc2-element"><b>属性</b><button data-value="雷外"><i class="tile-icon sprite lightning"></i><span>雷外</span></button><button data-value="水外"><i class="tile-icon sprite water"></i><span>水外</span></button></div>
        <div class="choice-row" data-key="gc2-gaze"><b>視線</b><button data-value="見る"><i class="tile-icon sprite gaze"></i><span>見る</span></button><button data-value="見ない"><i class="tile-icon sprite gaze"></i><span>見ない</span></button></div>
        <div class="choice-row" data-key="gc2-water"><b>つなみ</b><button data-value="外"><i class="tile-icon sprite chaos-water"></i><span>外</span></button><button data-value="中"><i class="tile-icon sprite chaos-water"></i><span>中</span></button></div>
      </div>
      <div class="gc-select" data-gc="GC3">
        <h3>GC3</h3>
        <div class="choice-row" data-key="gc3-debuff"><b>傷</b><button data-value="アラガン異色"><i class="tile-icon sprite allagan"></i><span>アラガン異色</span></button><button data-value="超越同色"><i class="tile-icon sprite transcendence"></i><span>超越同色</span></button></div>
      </div>
      <div id="debuff-result" class="debuff-result" aria-live="polite"><span>SELECTED DEBUFFS</span><h3>選択してください</h3></div>
      <button id="clear-debuff" class="clear">デバフ選択をクリア</button>
    </section>

    <section class="calculator">
      <div class="section-head"><span>MAGIC OUT</span><h2>最終処理だけ計算</h2></div>
      <div class="calc-grid">
        <article class="input-card">
          <h3>マジックチャージ</h3>
          <div class="truth-input" data-key="chargeThunder"><b>⚡ サンダガ</b><div></div></div>
          <div class="truth-input" data-key="chargeBlizzard"><b>❄ ブリザガ</b><div></div></div>
        </article>
        <article class="input-card">
          <h3>マジックアウト</h3>
          <div class="truth-input" data-key="outThunder"><b>⚡ サンダガ</b><div></div></div>
          <div class="truth-input" data-key="outBlizzard"><b>❄ ブリザガ</b><div></div></div>
        </article>
      </div>
      <div id="result" class="result pending" aria-live="polite">
        <span>FINAL ACTION</span>
        <h2>4項目を入力</h2>
      </div>
      <button id="clear" class="clear">入力をクリア</button>
    </section>
  </main>
  <script src="debuff-cheatsheet.js"></script>
</body>
</html>
