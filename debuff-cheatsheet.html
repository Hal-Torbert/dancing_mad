<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P4 デバフカンペ・マジックアウト計算</title>
  <link rel="stylesheet" href="debuff-cheatsheet.css">
</head>
<body>
  <header>
    <div><span>P4 TANK TOOL</span><h1>デバフカンペ</h1></div>
    <div class="header-actions"><a href="index.html">← メインへ</a><button id="reset-all">全リセット</button></div>
  </header>
  <main>
    <section class="cheatsheet">
      <div class="section-head"><span>DEBUFF CHECK</span><h2>デバフ判定</h2></div>
      <div id="debuff-input">
        <div class="gc-select"><h3>① GC1回目</h3>
          <div class="choice-row" data-key="gc1-truth"><b>真偽</b><button data-value="うそ"><i class="tile-icon sprite gc-false"></i><span>うそ</span></button><button data-value="ほんと"><i class="tile-icon sprite gc-true"></i><span>ほんと</span></button></div>
          <div class="element-choice" data-gc="gc1"><b>水雷（該当時）</b><div class="element-grid"><button data-kind="雷" data-timing="早"><i class="tile-icon sprite lightning"></i><span>早雷</span></button><button data-kind="雷" data-timing="遅"><i class="tile-icon sprite lightning"></i><span>遅雷</span></button><button data-kind="水" data-timing="早"><i class="tile-icon sprite water"></i><span>早水</span></button><button data-kind="水" data-timing="遅"><i class="tile-icon sprite water"></i><span>遅水</span></button></div></div>
        </div>
        <div class="gc-select"><h3>② GC2回目</h3>
          <div class="choice-row" data-key="gc2-truth"><b>真偽</b><button data-value="うそ"><i class="tile-icon sprite gc-false"></i><span>うそ</span></button><button data-value="ほんと"><i class="tile-icon sprite gc-true"></i><span>ほんと</span></button></div>
          <div class="element-choice" data-gc="gc2" hidden><b>水雷</b><div class="element-grid"><button data-kind="雷" data-timing="早"><i class="tile-icon sprite lightning"></i><span>早雷</span></button><button data-kind="雷" data-timing="遅"><i class="tile-icon sprite lightning"></i><span>遅雷</span></button><button data-kind="水" data-timing="早"><i class="tile-icon sprite water"></i><span>早水</span></button><button data-kind="水" data-timing="遅"><i class="tile-icon sprite water"></i><span>遅水</span></button></div></div>
          <div id="gc2-auto" class="auto-value" hidden>GC2は頭割り＋加速度（自動）</div>
        </div>
        <div class="gc-select"><h3>③ ほのお</h3>
          <div class="choice-row" data-key="fire-truth"><b>真偽</b><button data-value="うそ"><i class="tile-icon sprite gc-false"></i><span>うそ</span></button><button data-value="ほんと"><i class="tile-icon sprite gc-true"></i><span>ほんと</span></button></div>
        </div>
        <div class="gc-select"><h3>④ つなみ</h3>
          <div class="choice-row" data-key="tsunami-truth"><b>真偽</b><button data-value="うそ"><i class="tile-icon sprite gc-false"></i><span>うそ</span></button><button data-value="ほんと"><i class="tile-icon sprite gc-true"></i><span>ほんと</span></button></div>
        </div>
        <button id="clear-debuff" class="clear">デバフ選択をクリア</button>
      </div>
      <div id="debuff-result" class="timeline-result" aria-live="polite" hidden></div>
    </section>

    <section class="calculator">
      <div class="section-head"><span>MAGIC OUT</span><h2>最終処理だけ計算</h2></div>
      <div class="calc-grid">
        <article class="input-card">
          <h3>マジックチャージ</h3>
          <div class="truth-input" data-key="chargeThunder"><b>⚡ サンダガ</b><div></div></div>
          <div class="truth-input" data-key="chargeBlizzard"><b>❄ ブリザガ</b><div></div></div>
        </article>
        <article class="input-card">
          <h3>マジックアウト</h3>
          <div class="truth-input" data-key="outThunder"><b>⚡ サンダガ</b><div></div></div>
          <div class="truth-input" data-key="outBlizzard"><b>❄ ブリザガ</b><div></div></div>
        </article>
      </div>
      <div id="result" class="result pending" aria-live="polite">
        <span>FINAL ACTION</span>
        <h2>4項目を入力</h2>
      </div>
      <button id="clear" class="clear">入力をクリア</button>
    </section>
  </main>
  <script src="debuff-cheatsheet.js"></script>
</body>
</html>
