<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P4 デバフカンペ・マジックアウト計算</title>
  <link rel="stylesheet" href="debuff-cheatsheet.css">
</head>
<body>
  <header>
    <div><span>P4 TANK TOOL</span><h1>デバフカンペ</h1></div>
    <div class="header-actions"><a href="index.html">← メインへ</a><button id="reset-all">全リセット</button></div>
  </header>
  <main>
    <section class="cheatsheet">
      <div class="section-head"><span>DEBUFF CHECK</span><h2>デバフ判定</h2></div>
      <div id="debuff-input">
        <div class="gc-select"><h3>① GC1回目</h3>
          <div class="choice-row" data-key="gc1-truth"><b>真偽</b><button data-value="うそ"><i class="tile-icon sprite gc-false"></i><span>うそ</span></button><button data-value="ほんと"><i class="tile-icon sprite gc-true"></i><span>ほんと</span></button></div>
          <div class="choice-row multi" data-key="gc1-kind"><b>デバフ</b><button data-value="雷"><i class="tile-icon sprite lightning"></i><span>雷</span></button><button data-value="水"><i class="tile-icon sprite water"></i><span>水</span></button><button data-value="視線＋加速度"><i class="tile-icon sprite gaze"></i><span>視線＋加速</span></button><button data-value="加速度のみ"><i class="tile-icon sprite acceleration"></i><span>加速のみ</span></button></div>
          <div class="choice-row timing-row" data-key="gc1-timing" hidden><b>水雷</b><button data-value="早"><span>早</span></button><button data-value="遅"><span>遅</span></button></div>
        </div>
        <div class="gc-select"><h3>② ほのおつなみ1回目</h3>
          <div class="choice-row" data-key="chaos1-truth"><b>真偽</b><button data-value="うそ"><i class="tile-icon sprite gc-false"></i><span>うそ</span></button><button data-value="ほんと"><i class="tile-icon sprite gc-true"></i><span>ほんと</span></button></div>
          <div class="choice-row" data-key="chaos1-kind"><b>種類</b><button data-value="ほのお"><i class="tile-icon sprite fire"></i><span>ほのお</span></button><button data-value="つなみ"><i class="tile-icon sprite chaos-water"></i><span>つなみ</span></button></div>
        </div>
        <div class="gc-select"><h3>③ GC2回目</h3>
          <div class="choice-row" data-key="gc2-truth"><b>真偽</b><button data-value="うそ"><i class="tile-icon sprite gc-false"></i><span>うそ</span></button><button data-value="ほんと"><i class="tile-icon sprite gc-true"></i><span>ほんと</span></button></div>
          <div class="choice-row multi" data-key="gc2-kind"><b>デバフ</b><button data-value="雷"><i class="tile-icon sprite lightning"></i><span>雷</span></button><button data-value="水"><i class="tile-icon sprite water"></i><span>水</span></button><button data-value="視線＋加速度"><i class="tile-icon sprite gaze"></i><span>視線＋加速</span></button><button data-value="加速度のみ"><i class="tile-icon sprite acceleration"></i><span>加速のみ</span></button></div>
          <div class="choice-row timing-row" data-key="gc2-timing" hidden><b>水雷</b><button data-value="早"><span>早</span></button><button data-value="遅"><span>遅</span></button></div>
        </div>
        <div class="gc-select"><h3>④ ほのおつなみ2回目</h3>
          <div class="choice-row" data-key="chaos2-truth"><b>真偽</b><button data-value="うそ"><i class="tile-icon sprite gc-false"></i><span>うそ</span></button><button data-value="ほんと"><i class="tile-icon sprite gc-true"></i><span>ほんと</span></button></div>
          <div id="chaos2-kind" class="auto-value">種類は1回目の反対を自動選択</div>
        </div>
        <div class="gc-select"><h3>⑤ GC3</h3>
          <div class="choice-row" data-key="gc3-debuff"><b>傷</b><button data-value="アラガン異色"><i class="tile-icon sprite allagan"></i><span>アラガン異色</span></button><button data-value="超越同色"><i class="tile-icon sprite transcendence"></i><span>超越同色</span></button></div>
          <div class="choice-row" data-key="beam-truth"><b>ビーム</b><button data-value="うそ"><i class="tile-icon sprite gc-false"></i><span>うそ</span></button><button data-value="ほんと"><i class="tile-icon sprite gc-true"></i><span>ほんと</span></button></div>
        </div>
        <button id="clear-debuff" class="clear">デバフ選択をクリア</button>
      </div>
      <div id="debuff-result" class="timeline-result" aria-live="polite" hidden></div>
    </section>

    <section class="calculator">
      <div class="section-head"><span>MAGIC OUT</span><h2>最終処理だけ計算</h2></div>
      <div class="calc-grid">
        <article class="input-card">
          <h3>マジックチャージ</h3>
          <div class="truth-input" data-key="chargeThunder"><b>⚡ サンダガ</b><div></div></div>
          <div class="truth-input" data-key="chargeBlizzard"><b>❄ ブリザガ</b><div></div></div>
        </article>
        <article class="input-card">
          <h3>マジックアウト</h3>
          <div class="truth-input" data-key="outThunder"><b>⚡ サンダガ</b><div></div></div>
          <div class="truth-input" data-key="outBlizzard"><b>❄ ブリザガ</b><div></div></div>
        </article>
      </div>
      <div id="result" class="result pending" aria-live="polite">
        <span>FINAL ACTION</span>
        <h2>4項目を入力</h2>
      </div>
      <button id="clear" class="clear">入力をクリア</button>
    </section>
  </main>
  <script src="debuff-cheatsheet.js"></script>
</body>
</html>
